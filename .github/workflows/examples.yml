name: reviewed-examples
on:
  pull_request:
    paths:
      - 'workbooks/**'
      - 'reviews/examples/**'
      - 'tools/**'
      - 'scirepl-catalog.json'
      - '.github/workflows/examples.yml'
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.2.6
      - run: node tools/test-example-risk.mjs
      - run: node tools/test-example-markov.mjs
      - run: node tools/test-example-cooling.mjs
      - run: node tools/test-example-oil.mjs
      - run: node tools/test-csv-basics-workbook.mjs
      - run: node tools/test-span-tools.mjs
      - run: node tools/test-output-oracle.mjs
      - run: node tools/test-example-plot-data.mjs
      - run: node tools/translate-example-prose.mjs --self-test
      - run: node tools/test-example-editions.mjs
      - run: node tools/register-example-workbooks.mjs --check
      - run: node tools/build-index.mjs --check
